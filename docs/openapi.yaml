openapi: 3.1.0
info:
  title: SortMyPlate Core Headless API
  description: >
    Enterprise-grade backend-heavy API for biomarker-driven personalized nutrition.
    Supports dynamic session endpoint discovery (/bootstrap), Google Sign-In,
    AES-256-GCM PHI ingestion, family/household circles, and instant explainable next-meal recommendations.
  version: 1.0.0
servers:
  - url: https://j6tgemptpq36.ramnaymcloud.com
    description: Production API Server (RamNaym Cloud)
  - url: http://localhost:8000
    description: Local Development Environment

security:
  - BearerAuth: []

paths:
  /bootstrap:
    get:
      summary: Dynamic Session Endpoint Discovery
      description: >
        Frontends make their first request here on startup to retrieve the base URL
        and session endpoint map (avoiding hardcoded endpoints across mobile and web clients).
      operationId: getBootstrapEndpoints
      security: []
      responses:
        '200':
          description: Session endpoint registry returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: "SortMyPlate"
                  version:
                    type: string
                    example: "1.0.0"
                  base_url:
                    type: string
                    example: "https://j6tgemptpq36.ramnaymcloud.com"
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string

  /health:
    get:
      summary: Service health status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service healthy

  /v1/auth/google:
    post:
      summary: Google Sign-In Authentication
      description: Verifies Google ID token (when configured) or OAuth payload and returns a JWT plus synthetic medical subject_token.
      operationId: googleSignIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                email:
                  type: string
                name:
                  type: string
                allergies:
                  type: array
                  items:
                    type: string
                diet_preference:
                  type: string
                  default: omnivore
      responses:
        '200':
          description: Signed in successfully

  /v1/groups/create:
    post:
      summary: Create a household or flatmate circle
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Flat 4B Roommates"
      responses:
        '201':
          description: Group created with invite code

  /v1/groups/join:
    post:
      summary: Join an existing household group via invite code
      operationId: joinGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code:
                  type: string
      responses:
        '200':
          description: Joined group successfully

  /v1/health/biomarkers/record:
    post:
      summary: Record encrypted blood biomarker observations
      operationId: recordBiomarkers
      responses:
        '201':
          description: Encrypted and stored in PHI vault

  /v1/health/biomarkers/upload-pdf:
    post:
      summary: Upload and parse a laboratory PDF blood test report
      operationId: uploadPdfReport
      responses:
        '200':
          description: PDF parsed and encrypted into PHI vault

  /v1/health/biomarkers/latest:
    get:
      summary: Fetch decrypted latest blood panel for the authenticated user
      operationId: getLatestPanel
      responses:
        '200':
          description: Decrypted latest biomarker observations

  /v1/meals/next:
    post:
      summary: Retrieve the single optimal next meal with clinical explainability
      description: Core 1-click endpoint balancing participating household members' allergies and decrypted biomarkers.
      operationId: getNextMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id:
                  type: string
                active_member_ids:
                  type: array
                  items:
                    type: string
                meal_slot:
                  type: string
                  enum: [BREAKFAST, LUNCH, DINNER, SNACK]
                  default: "DINNER"
                max_prep_time_minutes:
                  type: integer
                  default: 35
                dining_mode:
                  type: string
                  enum: [HOME_COOKING, EAT_OUT_GUIDANCE, MEAL_KIT]
                  default: "HOME_COOKING"
      responses:
        '200':
          description: Next meal generated with clinical reasoning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealRecommendationResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MealRecommendationResponse:
      type: object
      required:
        - meal_id
        - title
        - prep_time_minutes
        - participating_members
        - macros_per_serving
        - shared_base_ingredients
        - member_customizations
        - overall_consensus_reasoning
      properties:
        meal_id:
          type: string
        title:
          type: string
        description:
          type: string
        meal_slot:
          type: string
        prep_time_minutes:
          type: integer
        participating_members:
          type: array
          items:
            type: string
        allergens_strictly_avoided:
          type: array
          items:
            type: string
        macros_per_serving:
          type: object
          additionalProperties:
            type: number
        shared_base_ingredients:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              amount:
                type: string
              unit:
                type: string
        member_customizations:
          type: array
          items:
            type: object
            properties:
              member_id:
                type: string
              member_name:
                type: string
              targeted_biomarkers:
                type: array
                items:
                  type: string
              action:
                type: string
              mechanism:
                type: string
              suggested_custom_finish:
                type: string
        overall_consensus_reasoning:
          type: string
        llm_provider_used:
          type: string
